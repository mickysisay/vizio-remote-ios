name: VizioRemote
options:
  bundleIdPrefix: home.lan
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # XcodeGen defaults to the Xcode 16 project format (objectVersion 77), which Xcode 15.4
  # on the macos-14 runners cannot open at all ("future Xcode project file format").
  # xcode15_3 writes the older format that Xcode 15.x reads.
  projectFormat: xcode15_3

targets:
  VizioRemote:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Vizio Remote
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "5"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          # the app talks to the TV over https with its own certificate, and can also
          # talk to the optional PC bridge over plain http while debugging.
          NSAllowsArbitraryLoads: true
        # iOS 14 and later gate every connection to a local-network address behind the
        # Local Network permission. This is the string that prompt shows.
        NSLocalNetworkUsageDescription: Vizio Remote needs to reach your TV on the local network to send remote-control commands and read volume and input.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: home.lan.vizioremote
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "5"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
