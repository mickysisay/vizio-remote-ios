name: VizioRemote
options:
  bundleIdPrefix: home.lan
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  VizioRemote:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Vizio Remote
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          # the app talks to the TV over https with its own certificate, and can also
          # talk to the optional PC bridge over plain http while debugging.
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: home.lan.vizioremote
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
