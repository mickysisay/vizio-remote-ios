name: build-ios-app

# Builds an UNSIGNED .ipa, uploads it as an artifact, and attaches it to a release so the
# phone can install it straight from a URL with SideStore:
#     sidestore://install?url=<asset url>
# Sideloading signs the app with your own Apple ID, so no developer account and no Mac.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Report toolchain and project
        run: |
          echo "::notice::xcodebuild $(xcodebuild -version | tr '\n' ' ')"
          echo "::notice::xcodegen $(xcodegen --version 2>&1)"
          echo "::notice::files: $(ls -1 | tr '\n' ' ')"
          echo "::notice::project format on disk: $(grep -m1 objectVersion VizioRemote.xcodeproj/project.pbxproj)"
          echo "::notice::targets: $(xcodebuild -list -project VizioRemote.xcodeproj 2>&1 | tr '\n' ' ' | cut -c1-500)"

      - name: Build unsigned for device
        run: |
          set -o pipefail
          if xcodebuild \
               -project VizioRemote.xcodeproj \
               -target VizioRemote \
               -configuration Release \
               -sdk iphoneos \
               CONFIGURATION_BUILD_DIR="$PWD/build/products" \
               CODE_SIGNING_ALLOWED=NO \
               CODE_SIGNING_REQUIRED=NO \
               2>&1 | tee build.log
          then
            echo "BUILD OK"
          else
            echo "=== build.log, last 70 lines ==="
            tail -n 70 build.log || true
            echo "=== surfacing build errors as annotations (readable without signing in) ==="
            grep -a "error:" build.log | head -n 25 | while IFS= read -r line; do
              echo "::error::$(printf '%s' "$line" | sed 's/%/%25/g')"
            done
            grep -a -E "xcodebuild: error|does not contain a scheme|BUILD FAILED|The following build commands failed" build.log | head -n 8 | while IFS= read -r line; do
              echo "::error::$(printf '%s' "$line" | sed 's/%/%25/g')"
            done
            exit 1
          fi

      - name: Show what was built
        run: ls -la build/products/ || true

      - name: Package the .ipa
        run: |
          mkdir -p Payload
          cp -R build/products/VizioRemote.app Payload/
          zip -qry VizioRemote-unsigned.ipa Payload
          ls -lh VizioRemote-unsigned.ipa

      - name: Upload the artifact
        uses: actions/upload-artifact@v7
        with:
          name: VizioRemote-unsigned-ipa
          path: VizioRemote-unsigned.ipa
          if-no-files-found: error

      - name: Publish a release carrying the .ipa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$(date -u +%Y%m%d-%H%M%S)"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/VizioRemote-unsigned.ipa"
          gh release create "$tag" VizioRemote-unsigned.ipa \
            --title "Vizio Remote $tag" \
            --notes "Unsigned IPA built from ${GITHUB_SHA:0:7}. Install with SideStore by opening this on the phone: sidestore://install?url=${url}"
          echo "::notice::install on the phone with: sidestore://install?url=${url}"
